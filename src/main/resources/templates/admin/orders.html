<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Orders — Admin</title>
    <meta name="description" content="Admin view of all active canteen orders.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="nav">
    <a href="/" class="nav-brand"><span class="icon">🍽️</span> Canteen</a>
    <div class="nav-links" id="nav-links-dynamic"></div>
    <div class="nav-actions" id="nav-actions"></div>
</nav>

<div class="page">
    <div class="page-header">
        <div>
            <h1 class="page-title">📋 All Active Orders</h1>
            <p class="page-subtitle">Read-only overview of all orders currently in the system</p>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input id="search-input" type="text" class="form-control search-input"
                       placeholder="Search token # or student name" oninput="onSearch(this.value)">
            </div>
            <div style="display:flex; gap:0.35rem; flex-wrap:wrap;" id="filter-btns">
                <button onclick="setFilter('')"           class="btn btn-primary btn-sm"   id="f-all">All</button>
                <button onclick="setFilter('PENDING')"    class="btn btn-ghost btn-sm"     id="f-PENDING">Pending</button>
                <button onclick="setFilter('PREPARING')"  class="btn btn-ghost btn-sm"     id="f-PREPARING">Preparing</button>
                <button onclick="setFilter('READY')"      class="btn btn-ghost btn-sm"     id="f-READY">Ready</button>
                <button onclick="setFilter('COLLECTED')"  class="btn btn-ghost btn-sm"     id="f-COLLECTED">Collected</button>
            </div>
            <button onclick="loadOrders()" class="btn btn-outline btn-sm" id="refresh-btn">↻ Refresh</button>
        </div>
    </div>

    <div id="orders-container">
        <div class="empty-state"><p>Loading orders…</p></div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script th:src="@{/js/nav.js}"></script>
<script>
    AUTH.initNav('aord');
    AUTH.requireRole('ADMIN');

    let allOrders   = [];
    let activeFilter = '';
    let searchQuery  = '';

    async function loadOrders() {
        document.getElementById('refresh-btn').textContent = '⏳';
        try {
            const res = await fetch('/api/tokens/queue', { headers: AUTH.headers() });
            if (res.status === 401 || res.status === 403) { window.location.href = '/login'; return; }
            allOrders = await res.json();
            applyFilters();
        } catch(e) {
            document.getElementById('orders-container').innerHTML =
                '<div class="empty-state"><span class="empty-icon">⚠️</span><p>Failed to load orders.</p></div>';
        } finally {
            document.getElementById('refresh-btn').textContent = '↻ Refresh';
        }
    }

    function setFilter(status) {
        activeFilter = status;
        // Update button styles
        ['all','PENDING','PREPARING','READY','COLLECTED'].forEach(k => {
            const btn = document.getElementById('f-' + (k === 'all' ? 'all' : k));
            if (btn) btn.className = 'btn btn-sm ' + ((k === 'all' ? '' : k) === activeFilter ? 'btn-primary' : 'btn-ghost');
        });
        applyFilters();
    }

    function onSearch(q) {
        searchQuery = q.toLowerCase().trim();
        applyFilters();
    }

    function applyFilters() {
        let filtered = allOrders;
        if (activeFilter)  filtered = filtered.filter(t => t.status === activeFilter);
        if (searchQuery)   filtered = filtered.filter(t =>
            String(t.id).includes(searchQuery) ||
            (t.studentName || '').toLowerCase().includes(searchQuery) ||
            (t.acceptedByStaffName || '').toLowerCase().includes(searchQuery)
        );
        renderOrders(filtered);
    }

    function renderOrders(orders) {
        const container = document.getElementById('orders-container');
        if (!orders || orders.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="empty-icon">✨</span>
                    <h3>No orders match</h3>
                    <p>Try a different filter or search term.</p>
                </div>`;
            return;
        }

        container.innerHTML = `
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Token #</th>
                            <th>Student</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Accepted By</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${orders.map(t => {
                            let items = [];
                            try { items = JSON.parse(t.items); } catch(e) {}
                            const summary = items.map(i => `${i.name} ×${i.qty}`).join(', ');
                            const total   = items.reduce((s, i) => s + ((i.price || 0) * i.qty), 0);
                            const dt      = new Date(t.createdAt);
                            const timeStr = dt.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
                            const dateStr = dt.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
                            const staffCell = t.acceptedByStaffName
                                ? `<span style="display:flex;align-items:center;gap:0.35rem;font-size:0.85rem;font-weight:600;"><span style="width:22px;height:22px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:800;">${t.acceptedByStaffName.charAt(0).toUpperCase()}</span>${t.acceptedByStaffName}</span>`
                                : '<span class="badge badge-PENDING" style="font-size:0.72rem;">Unaccepted</span>';
                            return `
                                <tr>
                                    <td><strong>#${t.id}</strong></td>
                                    <td>${t.studentName || '—'}</td>
                                    <td class="text-sm text-muted" style="max-width:200px;">${summary}</td>
                                    <td class="fw-700 text-sm">${total > 0 ? '₹' + total.toFixed(2) : '—'}</td>
                                    <td><span class="badge badge-${t.status}">${t.status}</span></td>
                                    <td>${staffCell}</td>
                                    <td class="text-muted text-sm">${dateStr} ${timeStr}</td>
                                </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    loadOrders();
    setInterval(loadOrders, 30000);
</script>
</body>
</html>
