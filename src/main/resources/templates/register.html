<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Canteen Token System</title>
    <meta name="description" content="Create a new account for the College Canteen Token System">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="icon">🍽️</span>
            <h1>Create account</h1>
            <p>Join the canteen token system</p>
        </div>

        <div id="error-msg" class="mb-2" style="display:none;
            padding:0.75rem 1rem; background:var(--danger-bg); color:var(--danger);
            border:1px solid hsl(4,86%,80%); border-radius:var(--radius); font-size:0.88rem; font-weight:500;">
        </div>

        <form id="register-form" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" class="form-control" placeholder="John Doe" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" type="email" class="form-control" placeholder="you@college.edu" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" placeholder="Min. 6 characters" required autocomplete="new-password" minlength="6">
            </div>

            <input type="hidden" id="role-student" name="role" value="STUDENT">

            <button type="submit" id="submit-btn" class="btn btn-primary btn-full btn-lg mt-2">
                Create account
            </button>
        </form>

        <div class="auth-footer mt-2">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const errEl = document.getElementById('error-msg');
        errEl.style.display = 'none';

        const name     = document.getElementById('name').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const role     = 'STUDENT';

        if (!name || !email || !password) {
            showError('Please fill in all fields.');
            return;
        }
        if (password.length < 6) {
            showError('Password must be at least 6 characters.');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Creating account…';

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role })
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.message || 'Registration failed. Please try again.');
                return;
            }

            // Auto-login after registration
            const loginRes = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const loginData = await loginRes.json();

            if (loginRes.ok) {
                localStorage.setItem('jwt_token', loginData.token);
                localStorage.setItem('user_role',  loginData.role);
                localStorage.setItem('user_id',    loginData.userId);
                localStorage.setItem('user_name',  loginData.name);
                localStorage.setItem('user_email', loginData.email);
                document.cookie = `JWT_TOKEN=${loginData.token}; path=/; SameSite=Strict`;

                if (loginData.role === 'ADMIN')       window.location.href = '/dashboard';
                else if (loginData.role === 'STAFF')  window.location.href = '/staff/queue';
                else                                   window.location.href = '/menu';
            } else {
                window.location.href = '/login?registered=1';
            }

        } catch (err) {
            showError('Connection error. Please try again.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Create account';
        }
    });

    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('submit-btn').innerHTML = 'Create account';
    }
</script>
</body>
</html>
